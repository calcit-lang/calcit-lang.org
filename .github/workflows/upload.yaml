name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@v1

      - name: Validate Calcit snapshot and type baseline
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-public --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.updater --summary-only --format json
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,unresolved-type-slot,code-dynamic --intent unresolved --summary-only --format json
          calcit calcit.cirru analyze deprecated --summary-only --format json
          calcit calcit.cirru analyze dynamic-methods

      - name: "compiles to js"
        run: >
          calcit calcit.cirru js
          && yarn vite build --base=./

      - name: Deploy to server
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
